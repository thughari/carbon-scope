<div class="grid gap-4 sm:gap-5 grid-cols-1 xl:grid-cols-2">
  <div class="glass-card p-4 sm:p-5 h-[340px] sm:h-[390px] flex flex-col bg-slate-900/50 border border-white/10 rounded-2xl">
    <div class="flex items-center justify-between mb-2 shrink-0">
      <div>
        <h3 class="text-sm sm:text-base font-bold text-white tracking-wide">Macro-Sector Distribution</h3>
        <p class="text-[11px] text-slate-400">Emissions by economic sector in Megatonnes (Mt CO₂e)</p>
      </div>
      <div class="text-[10px] sm:text-[11px] font-semibold text-sky-400 bg-sky-950/60 border border-sky-800/40 px-2.5 py-1 rounded-lg shrink-0">
        Top Sectors
      </div>
    </div>
    <div class="flex-1 w-full min-h-0 overflow-hidden">
      <div id="sectorBarChart" class="w-full h-full"></div>
    </div>
  </div>

  <div class="glass-card p-4 sm:p-5 h-[340px] sm:h-[390px] flex flex-col bg-slate-900/50 border border-white/10 rounded-2xl">
    <div class="flex items-center justify-between mb-2 shrink-0">
      <div>
        <h3 class="text-sm sm:text-base font-bold text-white tracking-wide">Multi-Year Trajectory</h3>
        <p class="text-[11px] text-slate-400">Empirical historical consensus ({{ trendRangeText }})</p>
      </div>
      <div class="text-[10px] sm:text-[11px] font-semibold text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2.5 py-1 rounded-lg shrink-0">
        Empirical Trend
      </div>
    </div>
    <div class="flex-1 w-full min-h-0 overflow-hidden">
      <div id="trendLineChart" class="w-full h-full"></div>
    </div>
  </div>
</div>
