<div class="glass-card p-4 sm:p-6 overflow-hidden bg-slate-900/50 border border-white/10 rounded-2xl">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 border-b border-white/5 pb-3.5">
    <div>
      <div class="flex items-center gap-2">
        <div class="p-1.5 rounded-lg bg-sky-500/15 text-sky-400 border border-sky-500/20">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h3 class="text-sm sm:text-base font-bold text-white tracking-wide">Global Carbon Footprint Leaderboard</h3>
      </div>
      <p class="text-[11px] text-slate-400 mt-1">Select any nation to filter all charts, tables, and AI analysis</p>
    </div>

    <div class="flex items-center gap-2 self-start sm:self-auto">
      <span class="text-[11px] text-slate-400">Top 15 Combined Share:</span>
      <span class="px-2.5 py-0.5 rounded-full bg-indigo-500/15 border border-indigo-500/25 text-indigo-300 text-xs font-bold font-mono">
        ~72.3% of World
      </span>
    </div>
  </div>

  <div class="grid gap-2.5 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5">
    <div *ngFor="let c of topEmitters; let i = index"
      (click)="onSelect(c.code)"
      class="p-3 rounded-xl border transition-all duration-200 cursor-pointer flex flex-col justify-between group"
      [ngClass]="selectedCountry === c.code 
        ? 'bg-gradient-to-br from-indigo-950/70 to-slate-900 border-indigo-500/60 shadow-[0_0_12px_rgba(99,102,241,0.25)]' 
        : 'bg-slate-900/40 border-white/5 hover:bg-slate-800/50 hover:border-white/10'">

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-bold w-4 h-4 rounded flex items-center justify-center font-mono"
            [ngClass]="i < 3 ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-800 text-slate-400'">
            #{{ i + 1 }}
          </span>
          <span class="font-bold text-xs text-slate-100 group-hover:text-white transition-colors truncate">
            {{ c.name }}
          </span>
        </div>

        <span class="text-[11px] font-bold font-mono text-sky-400">
          {{ c.share | number:'1.1-1' }}%
        </span>
      </div>

      <div class="mt-2 flex items-baseline justify-between text-xs">
        <div>
          <span class="font-extrabold text-white font-mono text-sm">{{ c.emissionsMt | number:'1.0-0' }}</span>
          <span class="text-[10px] text-slate-400 ml-1">Mt</span>
        </div>
        <span class="text-[10px] text-slate-400 font-mono">{{ c.perCapita | number:'1.1-1' }} t/cap</span>
      </div>

      <div class="mt-2 w-full h-1 bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full rounded-full transition-all duration-700"
          [style.width.%]="(c.share / 30) * 100"
          [ngClass]="i === 0 ? 'bg-rose-500' : (i < 3 ? 'bg-indigo-500' : 'bg-sky-400')">
        </div>
      </div>
    </div>
  </div>
</div>
