<div class="glass-card p-3.5 md:p-4 bg-slate-900/60 backdrop-blur-md border border-white/10 rounded-2xl shadow-lg">
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">

    <!-- Title and Quick Reset -->
    <div class="flex items-center justify-between lg:justify-start gap-2.5 shrink-0">
      <div class="flex items-center gap-2">
        <div class="p-1.5 rounded-lg bg-sky-500/15 text-sky-400 border border-sky-500/20">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
        </div>
        <div>
          <span class="text-xs font-bold text-white uppercase tracking-wider block">Scope & Filters</span>
          <span class="text-[10px] text-slate-400 font-medium block">
            {{ filters.country ? 'Country View' : (filters.continent ? filters.continent : 'Worldwide') }} • {{ filters.year }}
          </span>
        </div>
      </div>

      <button *ngIf="filters.country || filters.continent" (click)="resetToGlobal()"
        class="text-[11px] font-semibold text-sky-400 hover:text-white px-2.5 py-1 rounded-lg bg-sky-950/70 border border-sky-700/50 hover:bg-sky-600 transition-all flex items-center gap-1 shadow-sm">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Reset Global
      </button>
    </div>

    <!-- Filter Dropdowns Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 flex-1 max-w-4xl">

      <!-- Country Filter -->
      <div class="relative group">
        <label class="absolute -top-1.5 left-2.5 bg-[#080d1e] px-1 text-[9px] font-bold text-slate-400 uppercase tracking-wider z-10 rounded">
          Nation
        </label>
        <select
          class="w-full bg-slate-950/80 border border-slate-700/80 text-slate-100 text-xs rounded-xl px-3 py-2.5 pr-7 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 appearance-none cursor-pointer hover:border-slate-500 transition-all truncate font-medium"
          [ngModel]="filters.country" (ngModelChange)="onChange({ country: $event })">
          <option [ngValue]="null">🌍 Global (Worldwide)</option>
          <option *ngFor="let c of countries" [ngValue]="c.code">
            {{ c.name }} ({{ c.code }})
          </option>
        </select>
        <div class="absolute right-2.5 top-3 pointer-events-none text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- Continent Filter -->
      <div class="relative group">
        <label class="absolute -top-1.5 left-2.5 bg-[#080d1e] px-1 text-[9px] font-bold text-slate-400 uppercase tracking-wider z-10 rounded">
          Continent
        </label>
        <select
          class="w-full bg-slate-950/80 border border-slate-700/80 text-slate-100 text-xs rounded-xl px-3 py-2.5 pr-7 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 appearance-none cursor-pointer hover:border-slate-500 transition-all truncate font-medium"
          [ngModel]="filters.continent" (ngModelChange)="onChange({ continent: $event })">
          <option [ngValue]="null">All Continents</option>
          <option *ngFor="let c of continents" [ngValue]="c">{{ c }}</option>
        </select>
        <div class="absolute right-2.5 top-3 pointer-events-none text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- Gas Type Metric -->
      <div class="relative group">
        <label class="absolute -top-1.5 left-2.5 bg-[#080d1e] px-1 text-[9px] font-bold text-slate-400 uppercase tracking-wider z-10 rounded">
          Gas Metric
        </label>
        <select
          class="w-full bg-slate-950/80 border border-slate-700/80 text-slate-100 text-xs rounded-xl px-3 py-2.5 pr-7 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 appearance-none cursor-pointer hover:border-slate-500 transition-all truncate font-medium"
          [ngModel]="filters.gas" (ngModelChange)="onChange({ gas: $event })">
          <option *ngFor="let g of gasOptions" [ngValue]="g.value">
            {{ g.label }}
          </option>
        </select>
        <div class="absolute right-2.5 top-3 pointer-events-none text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- Reporting Year -->
      <div class="relative group">
        <label class="absolute -top-1.5 left-2.5 bg-[#080d1e] px-1 text-[9px] font-bold text-slate-400 uppercase tracking-wider z-10 rounded">
          Year
        </label>
        <select
          class="w-full bg-slate-950/80 border border-slate-700/80 text-slate-100 text-xs rounded-xl px-3 py-2.5 pr-7 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 appearance-none cursor-pointer hover:border-slate-500 transition-all font-medium font-mono"
          [ngModel]="filters.year" (ngModelChange)="onChange({ year: $event })">
          <option *ngFor="let y of years" [ngValue]="y">{{ y }}</option>
        </select>
        <div class="absolute right-2.5 top-3 pointer-events-none text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

    </div>

  </div>
</div>
